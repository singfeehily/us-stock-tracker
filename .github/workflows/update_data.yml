name: Update Stock Data

on:
  schedule:
    # 1. 每日開盤前更新 (香港時間 20:30 / UTC 12:30)
    - cron: '30 12 * * 1-5'
    
    # 2. 美股盤中定時更新 (香港時間 21:30 - 04:00 / UTC 13:30 - 20:00)
    # 每 15 分鐘自動執行一次
    - cron: '*/15 13-20 * * 1-5'
    
    # 3. 美股收盤後結算 (香港時間 06:00 / UTC 22:00)
    - cron: '0 22 * * 1-5'

  workflow_dispatch: # 保留隨時手動點擊觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼庫
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 快取依賴，大幅縮短每次運行時間

      - name: 安裝所需套件
        run: |
          pip install yfinance pandas numpy

      - name: 執行量化分析腳本
        run: |
          python screener.py

      - name: 自動提交並推送 data.json
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Auto-update stock data.json [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || echo "Push skipped or failed"
