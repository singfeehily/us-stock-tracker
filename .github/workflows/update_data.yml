name: Update Stock Data

on:
  schedule:
    # 1. 香港時間每日早上 6:00 (美股收盤後)
    - cron: '0 22 * * 1-5'
    # 2. 香港時間每日晚上 8:30 (美股開盤前)
    - cron: '30 12 * * 1-5'
    # 3. 每 6 小時自動更新一次
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼庫
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          pip install yfinance pandas numpy

      - name: 執行量化分析腳本
        run: |
          python screener.py

      - name: 自動提交並推送 data.json
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Auto-update stock data.json" || echo "No changes to commit"
          git push || echo "Push skipped or failed"
