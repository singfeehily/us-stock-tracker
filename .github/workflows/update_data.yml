name: Update Stock Data

on:
  schedule:
    # 台灣/香港時間每日清晨 6:00 定時運行 (UTC 22:00)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 允許你隨時手動在 GitHub 網頁按鈕觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼庫
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          pip install yfinance pandas numpy

      - name: 執行量化分析腳本
        run: |
          python screener.py

      - name: 自動提交並推送 data.json
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Auto-update stock data.json [skip ci]" || exit 0
          git push
