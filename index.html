<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC 股票分析與交易監測</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1a1b23; color: #c9d1d9; overflow: hidden; }
        .glass-panel { background: #222530; border: 1px solid #363a48; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1a1b23; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .table-row-hover:hover { background-color: #2a2d3a; }
        
        /* P/D Matrix 滑桿視覺 */
        .pd-track { background: linear-gradient(to right, #166534 0%, #166534 49%, #4b5563 49%, #4b5563 51%, #991b1b 51%, #991b1b 100%); }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 8px; background-color: #238636; color: white; font-weight: 500; opacity: 0; transform: translateY(20px); transition: all 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background-color: #da3633; }

        /* 自定義 Checkbox 樣式 */
        .chart-checkbox { appearance: none; width: 14px; height: 14px; border: 1px solid #4b5563; border-radius: 3px; background-color: #1a1b23; cursor: pointer; position: relative; top: 2px; }
        .chart-checkbox:checked { background-color: #3b82f6; border-color: #3b82f6; }
        .chart-checkbox:checked::after { content: '✔'; position: absolute; color: white; font-size: 10px; left: 2px; top: -1px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- 頂部標題列 -->
    <header class="px-6 py-3 flex justify-between items-center bg-[#1a1b23] border-b border-[#363a48]">
        <h1 class="text-xl font-bold text-white tracking-wide">SMC 股票分析與交易監測</h1>
        <div class="flex items-center gap-4 text-xs">
            <span id="updateTimeText" class="text-gray-400">系統運算: 讀取中...</span>
            <span id="liveTimeText" class="text-blue-400 font-semibold"><i class="fa-solid fa-circle-dot animate-pulse mr-1 text-red-500"></i>LIVE: 連線中...</span>
        </div>
    </header>

    <!-- 雙視窗主內容區 -->
    <main class="flex-grow flex overflow-hidden p-4 gap-4">
        
        <!-- 左側：控制台與過濾池 -->
        <section class="w-full lg:w-5/12 flex flex-col gap-4">
            
            <!-- 控制面板 -->
            <div class="glass-panel rounded-xl p-4 flex flex-col gap-3 shrink-0">
                <div class="grid grid-cols-3 gap-4 items-end">
                    
                    <!-- 搜尋列 -->
                    <div class="col-span-1 relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-sm"></i>
                        <form onsubmit="addCustomStock(event)">
                            <input type="text" id="searchInput" placeholder="搜尋股票號碼..." class="w-full bg-[#1a1b23] border border-[#363a48] rounded-md py-1.5 pl-9 pr-3 text-sm text-white focus:outline-none focus:border-blue-500 uppercase">
                        </form>
                    </div>

                    <!-- 交易狀態下拉選單 -->
                    <div class="col-span-1 flex flex-col">
                        <label class="text-xs text-gray-400 mb-1">交易狀態 (Trade Status)</label>
                        <div class="relative">
                            <select id="filterStatus" onchange="renderScreenerData()" class="w-full bg-[#1a1b23] border border-[#363a48] rounded-md py-1.5 px-3 text-sm text-white appearance-none focus:outline-none focus:border-blue-500">
                                <option value="ALL">全部</option>
                                <option value="GREEN">🟢 可執行</option>
                                <option value="YELLOW">🟡 接近中</option>
                                <option value="RED">🔴 觀察中</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-3 top-2.5 text-gray-500 text-xs pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- 建議價格差異滑桿 (視覺示意) -->
                    <div class="col-span-1 flex flex-col">
                        <label class="text-xs text-gray-400 mb-1">建議價格差異 %</label>
                        <div class="flex items-center gap-2">
                            <input type="number" placeholder="0" class="w-1/2 bg-[#1a1b23] border border-[#363a48] rounded-md py-1 px-2 text-sm text-center text-white">
                            <span class="text-gray-500">-</span>
                            <input type="number" placeholder="0" class="w-1/2 bg-[#1a1b23] border border-[#363a48] rounded-md py-1 px-2 text-sm text-center text-white">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 核心監測數據表 -->
            <div class="glass-panel rounded-xl flex-grow flex flex-col overflow-hidden">
                <div class="overflow-y-auto flex-grow">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="sticky top-0 bg-[#222530] border-b border-[#363a48] z-10">
                            <tr>
                                <th class="px-4 py-3 font-medium text-gray-400 font-normal">股票號碼 <i class="fa-solid fa-sort ml-1 text-[10px]"></i></th>
                                <th class="px-4 py-3 font-medium text-gray-400 font-normal text-right">現價 <i class="fa-solid fa-sort ml-1 text-[10px]"></i></th>
                                <th class="px-4 py-3 font-medium text-gray-400 font-normal text-right">建議... <i class="fa-solid fa-sort ml-1 text-[10px]"></i></th>
                                <th class="px-4 py-3 font-medium text-gray-400 font-normal text-center cursor-pointer" onclick="changeSort('dist')">價格差異 % & 交易狀態 <i class="fa-solid fa-sort ml-1 text-[10px]"></i></th>
                                <th class="px-4 py-3 font-medium text-gray-400 font-normal text-center">溢價/折價 (P/D Matrix)</th>
                            </tr>
                        </thead>
                        <tbody id="screenerTableBody">
                            <tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">初始化數據中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 右側：高階 SMC 圖表 -->
        <section class="w-full lg:w-7/12 glass-panel rounded-xl flex flex-col relative overflow-hidden">
            <!-- 圖表控制列 -->
            <div class="px-4 py-3 flex justify-between items-center border-b border-[#363a48] bg-[#222530]">
                <div class="flex items-center gap-4">
                    <span id="chartSymbolTitle" class="text-lg font-bold text-white tracking-wider">等待選擇 - 1D 走勢</span>
                </div>
                
                <!-- 圖層開關 Checkbox -->
                <div class="flex items-center gap-3 text-xs text-gray-300">
                    <label class="flex items-center gap-1 cursor-pointer hover:text-white"><input type="checkbox" id="layer_long" checked onchange="updateChartOverlays()" class="chart-checkbox"> 做多區 (綠)</label>
                    <label class="flex items-center gap-1 cursor-pointer hover:text-white"><input type="checkbox" id="layer_short" checked onchange="updateChartOverlays()" class="chart-checkbox"> 做空區 (紅)</label>
                    <label class="flex items-center gap-1 cursor-pointer hover:text-white"><input type="checkbox" id="layer_fvg" checked onchange="updateChartOverlays()" class="chart-checkbox"> FVG</label>
                    <label class="flex items-center gap-1 cursor-pointer hover:text-white"><input type="checkbox" id="layer_ob" checked onchange="updateChartOverlays()" class="chart-checkbox"> OB</label>
                    <label class="flex items-center gap-1 cursor-pointer hover:text-white"><input type="checkbox" id="layer_liq" checked onchange="updateChartOverlays()" class="chart-checkbox"> 流動性</label>
                </div>
            </div>

            <!-- 圖表容器 -->
            <div class="relative flex-grow bg-[#1a1b23]">
                <div id="chartLoader" class="absolute inset-0 flex items-center justify-center bg-[#1a1b23]/80 z-20 hidden">
                    <i class="fa-solid fa-circle-notch fa-spin text-blue-500 text-3xl"></i>
                </div>
                <div id="tv_chart_container" class="absolute inset-0"></div>
                <div id="chartTooltip"></div>
            </div>
        </section>

    </main>

    <div id="toast-container"></div>

    <script>
        const VERCEL_API_URL = "https://stock-live-api.vercel.app/api/quote";
        let globalData = { updated_at: '載入中...', screener_data: [], chart_data: {} };
        let currentLivePrices = {}; 
        let sortCol = 'dist'; let sortDesc = false;
        let userWatchlist = ['AAPL', '00700.HK', 'NVDA', '00988.HK']; // 預設列表

        let chart = null, candleSeries = null;
        let activePriceLines = []; 
        let currentSymbolData = null, currentCandleData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            initChart();
            await loadJSONData();
            fetchLiveQuotes();
            setInterval(fetchLiveQuotes, 10000);
        });

        async function loadJSONData() {
            try {
                const response = await fetch('data.json?t=' + Date.now());
                if (!response.ok) throw new Error('連線異常');
                globalData = await response.json();
                document.getElementById('updateTimeText').innerText = `系統運算: ${globalData.updated_at} (HKT)`;
            } catch (err) {
                document.getElementById('updateTimeText').innerText = `離線安全模式`;
            }
            
            // 整合使用者自選與後端資料
            if (globalData.screener_data) {
                globalData.screener_data.forEach(d => {
                    if (!userWatchlist.includes(d.symbol)) userWatchlist.push(d.symbol);
                });
            }
            
            renderScreenerData();
            if (userWatchlist.length > 0) updateChartSymbol(userWatchlist[0]);
        }

        async function fetchLiveQuotes() {
            if (userWatchlist.length === 0) return;
            try {
                const response = await fetch(`${VERCEL_API_URL}?symbols=${userWatchlist.join(',')}&t=${Date.now()}`);
                if (!response.ok) return;
                const liveData = await response.json();
                
                const now = new Date();
                document.getElementById('liveTimeText').innerHTML = `<i class="fa-solid fa-circle-dot animate-pulse mr-1 text-red-500"></i>LIVE: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')} (HKT)`;

                for (let sym in liveData) {
                    if (liveData[sym].price) currentLivePrices[sym] = liveData[sym].price;
                }
                
                renderScreenerData(); // 重新渲染表格更新價格
                updateLiveChart(currentSymbolData ? currentSymbolData.symbol : null);
            } catch (err) {}
        }

        // ==========================================
        // 渲染左側表格 (整合 P/D Matrix)
        // ==========================================
        function renderScreenerData() {
            const tbody = document.getElementById('screenerTableBody');
            if (!tbody) return;

            let dataList = userWatchlist.map(sym => {
                let item = (globalData.screener_data || []).find(d => d.symbol === sym) || { symbol: sym };
                let livePrice = currentLivePrices[sym] || item.price || 0;
                
                // 計算狀態與距離
                let dist = 0, statusLabel = "🔴 觀察中", statusColor = "text-red-500", dotColor = "bg-red-500";
                let entryRef = item.entry_top || 0;

                if (item.entry_top > 0) {
                    if (item.direction === 'short') {
                        dist = ((item.entry_bot - livePrice) / livePrice) * 100;
                        if (livePrice <= item.entry_top && livePrice >= item.entry_bot) { statusLabel = "🟢 可執行"; statusColor = "text-green-400"; dotColor = "bg-green-500"; dist = 0; }
                        else if (dist <= 2.0 && dist > 0) { statusLabel = "🟡 接近中"; statusColor = "text-yellow-400"; dotColor = "bg-yellow-500"; }
                    } else {
                        dist = ((livePrice - item.entry_top) / item.entry_top) * 100;
                        if (livePrice <= item.entry_top && livePrice >= item.entry_bot) { statusLabel = "🟢 可執行"; statusColor = "text-green-400"; dotColor = "bg-green-500"; dist = 0; }
                        else if (dist <= 2.0 && dist > 0) { statusLabel = "🟡 接近中"; statusColor = "text-yellow-400"; dotColor = "bg-yellow-500"; }
                    }
                }

                // 計算 P/D Matrix 點位 (0-100%)
                let pdVal = 50;
                if (item.macro_bsl && item.macro_ssl && (item.macro_bsl - item.macro_ssl > 0)) {
                    pdVal = ((livePrice - item.macro_ssl) / (item.macro_bsl - item.macro_ssl)) * 100;
                    pdVal = Math.max(0, Math.min(100, pdVal));
                }
                
                return { ...item, livePrice, dist, statusLabel, statusColor, dotColor, entryRef, pdVal };
            });

            // 處理下拉選單過濾
            const statusFilter = document.getElementById('filterStatus').value;
            if (statusFilter === 'GREEN') dataList = dataList.filter(d => d.statusLabel.includes('可執行'));
            else if (statusFilter === 'YELLOW') dataList = dataList.filter(d => d.statusLabel.includes('接近中'));
            else if (statusFilter === 'RED') dataList = dataList.filter(d => d.statusLabel.includes('觀察中'));

            // 排序
            dataList.sort((a, b) => sortDesc ? b.dist - a.dist : a.dist - b.dist);

            tbody.innerHTML = '';
            dataList.forEach(d => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-[#363a48] table-row-hover cursor-pointer transition-colors';
                tr.onclick = () => updateChartSymbol(d.symbol);
                
                // 名稱處理 (支援美/港股後綴)
                let nameHtml = `<div class="font-medium text-gray-200">${d.symbol}</div>`;
                if(d.symbol === '00700.HK') nameHtml += `<div class="text-xs text-gray-500">(騰訊)</div>`;
                if(d.symbol === '00988.HK') nameHtml += `<div class="text-xs text-gray-500">(建行)</div>`;

                // 狀態與距離 UI
                let diffText = d.dist === 0 ? "已達標" : `${d.dist.toFixed(1)}%`;
                let statusHtml = `
                    <div class="flex flex-col items-center justify-center">
                        <div class="flex items-center gap-1.5 ${d.statusColor} font-semibold text-sm">
                            <div class="w-2 h-2 rounded-full ${d.dotColor}"></div> ${d.statusLabel}
                        </div>
                        <div class="text-[11px] text-gray-400 mt-1">建議價格差異: <span class="${d.dist < 0 ? 'text-red-400' : ''}">${diffText}</span></div>
                    </div>
                `;

                // 橫向 P/D Matrix UI
                let pdDotColor = d.pdVal > 50 ? '#ef4444' : '#22c55e'; // 紅貴，綠便宜
                let pdHtml = `
                    <div class="w-full max-w-[140px] mx-auto flex flex-col gap-1">
                        <div class="flex justify-between text-[10px] text-gray-400">
                            <span>Discount</span><span>0.5 均衡</span><span>Premium</span>
                        </div>
                        <div class="relative w-full h-1.5 rounded-full pd-track">
                            <div class="absolute top-[-3px] w-3 h-3 rounded-full border border-white z-10 shadow-sm transition-all duration-300" style="left: calc(${d.pdVal}% - 6px); background-color: ${pdDotColor};"></div>
                            <div class="absolute left-1/2 top-[-2px] w-px h-2.5 bg-gray-300 z-0"></div>
                        </div>
                    </div>
                `;

                tr.innerHTML = `
                    <td class="px-4 py-3">${nameHtml}</td>
                    <td class="px-4 py-3 text-right font-mono text-gray-200">${d.livePrice.toFixed(1)}</td>
                    <td class="px-4 py-3 text-right font-mono text-gray-400">${d.entryRef.toFixed(1)}</td>
                    <td class="px-4 py-3">${statusHtml}</td>
                    <td class="px-4 py-3 align-middle">${pdHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeSort(col) {
            if (sortCol === col) sortDesc = !sortDesc;
            else { sortCol = col; sortDesc = false; }
            renderScreenerData();
        }

        // ==========================================
        // 初始化圖表 (無遮擋半透明設定)
        // ==========================================
        function initChart() {
            const container = document.getElementById('tv_chart_container');
            const tooltip = document.getElementById('chartTooltip');

            chart = LightweightCharts.createChart(container, {
                layout: { textColor: '#9ca3af', background: { type: 'solid', color: '#1a1b23' } },
                grid: { vertLines: { color: '#2a2d3a' }, horzLines: { color: '#2a2d3a' } },
                timeScale: { borderColor: '#363a48', timeVisible: true },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#363a48' }
            });
            
            candleSeries = chart.addCandlestickSeries({
                upColor: '#22c55e', downColor: '#ef4444', 
                borderVisible: false, wickUpColor: '#22c55e', wickDownColor: '#ef4444'
            });

            // Tooltip 邏輯
            chart.subscribeCrosshairMove(param => {
                if (!param.point || !param.time || param.point.x < 0 || param.point.x > container.clientWidth || param.point.y < 0 || param.point.y > container.clientHeight) {
                    tooltip.style.display = 'none';
                } else {
                    const data = param.seriesData.get(candleSeries);
                    if (data) {
                        tooltip.style.display = 'block';
                        const color = data.close >= data.open ? '#22c55e' : '#ef4444';
                        tooltip.innerHTML = `<div class="text-gray-300 font-bold mb-1">Price Info</div>
                            <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs">
                                <div>O: <span style="color:${color}">${data.open.toFixed(2)}</span></div>
                                <div>H: <span style="color:${color}">${data.high.toFixed(2)}</span></div>
                                <div>L: <span style="color:${color}">${data.low.toFixed(2)}</span></div>
                                <div>C: <span style="color:${color}">${data.close.toFixed(2)}</span></div>
                            </div>`;
                    }
                }
            });

            new ResizeObserver(entries => {
                if (entries[0].target === container && container.clientWidth > 0) {
                    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
                }
            }).observe(container);
        }

        // ==========================================
        // 抓取 K 線與繪製 SMC 塗層
        // ==========================================
        async function updateChartSymbol(symbol) {
            document.getElementById('chartSymbolTitle').innerText = `${symbol} - 1D 走勢`;
            currentSymbolData = (globalData.screener_data || []).find(d => d.symbol === symbol);
            
            document.getElementById('chartLoader').style.display = 'flex';
            
            activePriceLines.forEach(line => candleSeries.removePriceLine(line));
            activePriceLines = [];

            try {
                const res = await fetch(`${VERCEL_API_URL}?symbols=${symbol}&interval=1d&t=${Date.now()}`);
                if (res.ok) {
                    const jsonRes = await res.json();
                    if (jsonRes[symbol] && jsonRes[symbol].chart) {
                        let uniqueChart = []; let lastTime = 0;
                        for (let c of jsonRes[symbol].chart) {
                            if (c.time !== lastTime) { uniqueChart.push(c); lastTime = c.time; }
                        }
                        currentCandleData = uniqueChart;
                        
                        // 確保補上當前最新價格
                        let livePrice = currentLivePrices[symbol];
                        if (livePrice && currentCandleData.length > 0) {
                            let lastC = currentCandleData[currentCandleData.length - 1];
                            lastC.close = livePrice;
                            if (livePrice > lastC.high) lastC.high = livePrice;
                            if (livePrice < lastC.low) lastC.low = livePrice;
                        }
                        candleSeries.setData(currentCandleData);
                    }
                }
            } catch (e) {}

            document.getElementById('chartLoader').style.display = 'none';
            updateChartOverlays(); // 繪製色塊
            chart.timeScale().fitContent();
        }

        function updateLiveChart(symbol) {
            if (!symbol || !candleSeries || currentCandleData.length === 0) return;
            const livePrice = currentLivePrices[symbol];
            if (livePrice) {
                let lastCandle = currentCandleData[currentCandleData.length - 1];
                lastCandle.close = livePrice;
                if (livePrice > lastCandle.high) lastCandle.high = livePrice;
                if (livePrice < lastCandle.low) lastCandle.low = livePrice;
                candleSeries.update(lastCandle);
            }
        }

        // 核心邏輯：控制極低透明度的色塊與右側邊緣標籤
        function updateChartOverlays() {
            if (!candleSeries || !currentSymbolData) return;
            
            activePriceLines.forEach(line => candleSeries.removePriceLine(line));
            activePriceLines = [];

            const showLong = document.getElementById('layer_long').checked;
            const showShort = document.getElementById('layer_short').checked;
            const showFvg = document.getElementById('layer_fvg').checked;
            const showOb = document.getElementById('layer_ob').checked;
            const showLiq = document.getElementById('layer_liq').checked;

            const isShort = currentSymbolData.direction === 'short';
            const zoneColor = isShort ? 'rgba(239, 68, 68, 0.15)' : 'rgba(34, 197, 94, 0.15)'; // 15% 紅/綠
            const fvgName = isShort ? '1D FVG (未緩解)' : '1D FVG (未緩解)';
            const obName = isShort ? '1D OB / LM FVG (未緩解)' : '1D OB (未緩解)';

            // 1. 繪製 SMC 區塊邊界 (模擬透明色塊)
            if (currentSymbolData.entry_top > 0) {
                if ((isShort && showShort) || (!isShort && showLong)) {
                    if (showFvg || showOb) {
                        // 上方實線 + 標籤推至最右 (axisLabelVisible 達成)
                        activePriceLines.push(candleSeries.createPriceLine({ 
                            price: currentSymbolData.entry_top, color: zoneColor, lineWidth: 1, 
                            lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: fvgName 
                        }));
                        // 下方實線
                        activePriceLines.push(candleSeries.createPriceLine({ 
                            price: currentSymbolData.entry_bot, color: zoneColor, lineWidth: 1, 
                            lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: obName 
                        }));
                        
                        // 中間補幾條極細虛線製造色塊感 (Low-Fi 模擬)
                        const step = (currentSymbolData.entry_top - currentSymbolData.entry_bot) / 4;
                        for(let i=1; i<4; i++) {
                            activePriceLines.push(candleSeries.createPriceLine({ 
                                price: currentSymbolData.entry_bot + (step*i), color: zoneColor, lineWidth: 1, 
                                lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false 
                            }));
                        }
                    }
                }

                // 2. 流動性標籤 (Liquidity Sweep)
                if (showLiq && currentSymbolData.smc_id === 'fvg_sweep') {
                    activePriceLines.push(candleSeries.createPriceLine({ 
                        price: currentSymbolData.sl, color: '#9ca3af', lineWidth: 1, 
                        lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: true, title: 'Liquidity Sweep' 
                    }));
                }
            }

            // 3. 溢價/折價 (P/D) 座標標籤
            if (currentSymbolData.macro_eq) {
                activePriceLines.push(candleSeries.createPriceLine({ 
                    price: currentSymbolData.macro_eq, color: '#6b7280', lineWidth: 1, 
                    lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '0.5 均衡點' 
                }));
                // 在上方標示 Premium，下方標示 Discount
                activePriceLines.push(candleSeries.createPriceLine({ 
                    price: currentSymbolData.macro_eq + ((currentSymbolData.macro_bsl - currentSymbolData.macro_eq) * 0.5), color: 'rgba(239, 68, 68, 0.4)', lineWidth: 0, 
                    lineStyle: LightweightCharts.LineStyle.SparseDotted, axisLabelVisible: true, title: '溢價區 (Premium)' 
                }));
                activePriceLines.push(candleSeries.createPriceLine({ 
                    price: currentSymbolData.macro_eq - ((currentSymbolData.macro_eq - currentSymbolData.macro_ssl) * 0.5), color: 'rgba(34, 197, 94, 0.4)', lineWidth: 0, 
                    lineStyle: LightweightCharts.LineStyle.SparseDotted, axisLabelVisible: true, title: '折價區 (Discount)' 
                }));
            }
        }

        function addCustomStock(e) {
            e.preventDefault();
            const input = document.getElementById('searchInput');
            if(!input) return;
            const val = input.value.trim().toUpperCase();
            if(!val) return;
            if(!userWatchlist.includes(val)) {
                userWatchlist.unshift(val);
                fetchLiveQuotes();
            }
            input.value = '';
        }
    </script>
</body>
</html>
