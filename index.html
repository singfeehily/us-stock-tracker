<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股狙擊器 (PRO LIVE)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0d1117; color: #c9d1d9; }
        .glass-panel { background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 6px; border: 2px solid #0d1117; }
        @media (max-width: 768px) {
            ::-webkit-scrollbar { height: 6px; } 
            ::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 6px; }
            .overflow-x-auto { -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
        }
        #mainHeader { transition: transform 0.3s ease-in-out; }
        .header-hidden { transform: translateY(-100%); }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 8px; background-color: #238636; color: white; font-weight: 500; opacity: 0; transform: translateY(20px); transition: all 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background-color: #da3633; }
        .clickable-row { cursor: pointer; transition: background-color 0.2s; }
        .clickable-row:hover { background-color: #1f242c; }
        .collapsible-content { transition: max-height 0.3s, opacity 0.3s; overflow: hidden; }
        .collapsed { max-height: 0 !important; opacity: 0; border: none !important; }
        
        #chartTooltip {
            position: absolute; left: 12px; top: 12px; z-index: 10;
            background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(4px);
            border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px;
            font-family: monospace; font-size: 12px; pointer-events: none; display: none;
        }
        canvas.sparkline { width: 100%; height: 32px; margin-top: 6px; opacity: 0.8; }
        #chartLoader { display: none; position: absolute; inset: 0; background: rgba(13,17,23,0.7); z-index: 20; align-items: center; justify-content: center; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <header id="mainHeader" class="glass-panel sticky top-0 z-40 px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4 flex-wrap w-full md:w-auto justify-between md:justify-start">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-crosshairs text-blue-500 text-xl md:text-2xl"></i>
                <h1 class="text-lg md:text-xl font-bold text-white tracking-wider">美股狙擊器 PRO</h1>
            </div>
            <div class="flex flex-col">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-bold text-green-400 flex items-center">
                        <i class="fa-solid fa-circle-dot text-red-500 mr-1.5 animate-pulse"></i> LIVE 報價
                    </span>
                    <a href="https://github.com/singfeehily/us-stock-tracker/actions" target="_blank" 
                       class="bg-[#21262d] hover:bg-[#30363d] text-gray-400 border border-[#30363d] px-2 py-1 rounded text-[10px] font-medium transition-colors">
                        <i class="fa-solid fa-rotate"></i> 更新 SMC
                    </a>
                </div>
                <span id="updateTimeText" class="text-[10px] text-gray-500 mt-1.5">SMC 運算時間: 讀取中...</span>
                <span id="liveTimeText" class="text-[10px] text-blue-400 mt-0.5">LIVE 報價: 連線中...</span>
            </div>
        </div>
        
        <form id="searchForm" onsubmit="addCustomStock(event)" class="flex w-full md:w-1/3 relative">
            <div class="relative w-full flex">
                <input type="text" id="searchInput" list="stock-suggestions" placeholder="輸入代號 (例: AAPL)" 
                    class="w-full bg-[#0d1117] border border-[#30363d] rounded-l-lg py-2 px-3 text-white text-sm focus:outline-none focus:border-blue-500 uppercase" autocomplete="off">
                <datalist id="stock-suggestions"></datalist>
            </div>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-r-lg text-xs font-medium whitespace-nowrap transition-colors border-l-0 flex items-center">
                <i class="fa-solid fa-plus mr-1"></i> 加入
            </button>
        </form>
    </header>

    <main class="flex-grow p-3 md:p-6 flex flex-col gap-6">
        <section class="glass-panel rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-[#30363d] bg-[#161b22] flex justify-between items-center cursor-pointer" onclick="toggleSection('watchlistContent', 'watchlistIcon')">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-star text-yellow-500"></i>
                    <h2 class="text-lg font-semibold text-white">我的最愛自選股</h2>
                </div>
                <i id="watchlistIcon" class="fa-solid fa-chevron-up text-gray-500 transition-transform duration-300"></i>
            </div>
            <div id="watchlistContent" class="collapsible-content" style="max-height: 300px;">
                <div id="watchlistContainer" class="flex gap-4 overflow-x-auto p-4"></div>
            </div>
        </section>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
            <!-- 左邊欄：圖表與 AI 面板 -->
            <div class="xl:col-span-1 flex flex-col gap-6">
                <!-- 圖表區 -->
                <div class="glass-panel rounded-xl flex flex-col relative">
                    <div class="px-4 py-3 border-b border-[#30363d] flex justify-between items-center bg-[#161b22] cursor-pointer" onclick="toggleSection('chartContent', 'chartIcon')">
                        <span class="font-semibold text-white"><i class="fa-solid fa-display text-purple-400 mr-2"></i>SMC 作戰區間圖</span>
                        <div class="flex items-center gap-3">
                            <span id="currentChartSymbol" class="bg-blue-900/50 text-blue-400 px-2 py-1 rounded text-xs font-bold">--</span>
                            <i id="chartIcon" class="fa-solid fa-chevron-up text-gray-500 transition-transform duration-300"></i>
                        </div>
                    </div>
                    <div id="chartContent" class="collapsible-content p-3 flex flex-col gap-3" style="max-height: 650px;">
                        <div class="flex flex-col xl:flex-row gap-3">
                            <div class="bg-[#0d1117] border border-[#30363d] rounded-lg p-1.5 flex gap-1 text-xs items-center justify-center">
                                <button onclick="changeTimeFrame('15m')" id="tf_15m" class="px-3 py-1 font-medium rounded text-gray-400 hover:text-white transition-colors">15m</button>
                                <button onclick="changeTimeFrame('4H')" id="tf_4H" class="px-3 py-1 font-medium rounded text-gray-400 hover:text-white transition-colors">4H</button>
                                <button onclick="changeTimeFrame('1D')" id="tf_1D" class="px-3 py-1 font-medium rounded bg-[#30363d] text-white transition-colors">1D</button>
                            </div>
                        </div>
                        <div id="tv_chart_container" style="height: 380px; width: 100%; position: relative;">
                            <div id="chartLoader"><i class="fa-solid fa-circle-notch fa-spin text-blue-500 text-3xl"></i></div>
                            <div id="chartTooltip"></div>
                        </div>
                    </div>
                </div>

                <!-- 🤖 AI 智能股票深度解析面板 -->
                <div class="glass-panel rounded-xl flex flex-col relative overflow-hidden">
                    <div class="px-4 py-3 border-b border-[#30363d] flex justify-between items-center bg-[#161b22] cursor-pointer" onclick="toggleSection('aiPanelContent', 'aiPanelIcon')">
                        <div class="flex items-center gap-2">
                            <span class="font-semibold text-white text-sm"><i class="fa-solid fa-robot text-blue-400 mr-2"></i>AI 戰術核心面板</span>
                            <span id="panelSymbolBadge" class="bg-blue-900/50 text-blue-400 px-2 py-0.5 rounded text-xs font-bold">--</span>
                        </div>
                        <i id="aiPanelIcon" class="fa-solid fa-chevron-up text-gray-500 transition-transform duration-300"></i>
                    </div>
                    
                    <div id="aiPanelContent" class="collapsible-content p-4 flex flex-col gap-4" style="max-height: 800px;">
                        <!-- ⚡ 新增：直觀的 Premium/Discount 橫向視覺矩陣 -->
                        <div class="bg-[#0d1117] border border-[#30363d] rounded-lg p-3">
                            <div class="flex justify-between text-xs text-gray-400 mb-2">
                                <span>便宜折價區 (Discount)</span>
                                <span class="text-white font-bold" id="pdValueText">--%</span>
                                <span>昂貴溢價區 (Premium)</span>
                            </div>
                            <div class="relative w-full h-2.5 bg-gradient-to-r from-green-500/80 via-gray-600 to-red-500/80 rounded-full">
                                <div class="absolute top-[-4px] w-0.5 h-4 bg-white opacity-50 shadow-[0_0_4px_white]" style="left: 50%;"></div>
                                <div id="pdMarker" class="absolute top-[-3px] w-4 h-4 bg-blue-500 rounded-full border-2 border-white shadow-lg transition-all duration-500" style="left: 50%; transform: translateX(-50%);"></div>
                            </div>
                        </div>
                        
                        <div class="bg-[#0d1117] border border-[#30363d] rounded-lg p-3 text-[13px]">
                            <span class="text-gray-400 block mb-2 text-xs">強制紀律與防守底線 (Invalidation)</span>
                            <div id="panelInsight" class="text-gray-300 leading-relaxed font-medium">請選擇上方列表中的股票...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側欄位：篩選表格區 -->
            <div class="xl:col-span-2 glass-panel rounded-xl flex flex-col overflow-hidden">
                <div class="px-4 py-3 border-b border-[#30363d] bg-[#161b22] flex justify-between items-center cursor-pointer" onclick="toggleSection('screenerContent', 'screenerIcon')">
                    <span class="font-semibold text-white"><i class="fa-solid fa-bolt text-yellow-500 mr-2"></i>全方位 SMC 量化過濾池</span>
                    <i id="screenerIcon" class="fa-solid fa-chevron-up text-gray-500 transition-transform duration-300"></i>
                </div>
                
                <div id="screenerContent" class="collapsible-content flex flex-col" style="max-height: 800px;">
                    <div class="flex border-b border-[#30363d] bg-[#0d1117] px-2 gap-2 overflow-x-auto relative">
                        <button onclick="switchTab('smc')" id="tabSmc" class="px-4 py-2 text-sm font-medium text-blue-400 border-b-2 border-blue-500 transition-colors whitespace-nowrap">
                            <i class="fa-solid fa-layer-group mr-1"></i>S 級狙擊池
                        </button>
                        <button onclick="switchTab('watchlist')" id="tabWatchlist" class="px-4 py-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-white transition-colors whitespace-nowrap">
                            <i class="fa-solid fa-star mr-1"></i>核心監察總表
                        </button>
                    </div>

                    <div class="overflow-x-auto flex-grow">
                        <table class="w-full text-left border-collapse whitespace-nowrap text-sm">
                            <thead>
                                <tr class="border-b border-[#30363d] bg-[#0d1117]">
                                    <th class="px-4 py-3 font-medium text-gray-400">股票</th>
                                    <!-- ⚡ 整合了「交易狀態」與「距離%」 -->
                                    <th class="px-4 py-3 font-medium text-gray-400 text-left">交易狀態 & 即時距離</th>
                                    <th class="px-4 py-3 font-medium text-gray-400 text-center">
                                        形態
                                        <select id="filterDirection" onchange="renderScreenerData()" class="ml-1 bg-[#161b22] text-white border border-[#30363d] rounded px-1 py-0.5 text-xs outline-none focus:border-blue-500">
                                            <option value="ALL">全部 (All)</option>
                                            <option value="LONG">做多</option>
                                            <option value="SHORT">做空</option>
                                        </select>
                                    </th>
                                    <th class="px-4 py-3 font-medium text-gray-400 text-center cursor-pointer hover:text-white group" onclick="changeSort('rrr')">
                                        R:R <i class="fa-solid fa-sort text-gray-600 group-hover:text-blue-400 transition-colors ml-1"></i>
                                    </th>
                                    <th class="px-4 py-3 font-medium text-blue-400 text-right">OB 建議入場區</th>
                                    <th class="px-4 py-3 font-medium text-green-400 text-right">目標價(TP)</th>
                                    <th class="px-4 py-3 font-medium text-red-400 text-right">失效線(SL)</th>
                                </tr>
                            </thead>
                            <tbody id="screenerTableBody">
                                <tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">初始化中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script>
        const VERCEL_API_URL = "https://stock-live-api.vercel.app/api/quote";
        let globalData = { updated_at: '載入中...', watchlist_data: [], screener_data: [], chart_data: {} };
        let currentLivePrices = {}; 
        let sortCol = 'rrr'; let sortDesc = true;
        let currentTab = 'smc'; let currentTimeFrame = '1D'; 
        let userWatchlist = ['FUTU', 'PLTR', 'NVDA', 'TSLA', 'SPY'];

        let chart = null, candleSeries = null;
        let activePriceLines = [], currentPriceLine = null, macroPriceLines = []; 

        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const header = document.getElementById('mainHeader');
            if (!header) return;
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 60) header.classList.add('header-hidden');
            else header.classList.remove('header-hidden');
            lastScrollTop = scrollTop;
        });

        document.addEventListener('DOMContentLoaded', async () => {
            try { initCharts(); } catch (e) {}
            try { await loadJSONData(); } catch (e) {}
            try { fetchLiveQuotes(); } catch (e) {}
            setInterval(() => { try { fetchLiveQuotes(); } catch(e){} }, 10000); 
        });

        async function loadJSONData() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('連線異常');
                globalData = await response.json();
                document.getElementById('updateTimeText').innerText = `SMC 運算時間: ${globalData.updated_at || '最新'} (HKT)`;
            } catch (err) {
                document.getElementById('updateTimeText').innerText = `SMC 運算時間: 離線安全模式`;
                globalData = { updated_at: '離線模式', watchlist_data: [], screener_data: [], chart_data: {} };
            }
            renderWatchlist(); 
            renderScreenerData();
            if (globalData && Array.isArray(globalData.screener_data) && globalData.screener_data.length > 0) {
                updateChartSymbol(globalData.screener_data[0].symbol);
            } else { updateChartSymbol('SPY'); }
        }

        async function fetchLiveQuotes() {
            try {
                const symbolsSet = new Set(userWatchlist);
                const curSym = document.getElementById('currentChartSymbol');
                if (curSym && curSym.innerText !== '--') symbolsSet.add(curSym.innerText);
                if (symbolsSet.size === 0) return;

                const response = await fetch(`${VERCEL_API_URL}?symbols=${Array.from(symbolsSet).join(',')}&t=${Date.now()}`);
                if (!response.ok) return;
                const liveData = await response.json();

                const now = new Date();
                document.getElementById('liveTimeText').innerText = `LIVE 報價更新於: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')} (HKT)`;

                for(let sym in liveData) if (liveData[sym] && liveData[sym].price) currentLivePrices[sym] = liveData[sym].price;
                updateLiveUI(liveData, curSym ? curSym.innerText : null); 
            } catch (err) {}
        }

        function updateLiveUI(liveData, currentSymbol) {
            try {
                userWatchlist.forEach(sym => {
                    if(liveData[sym]) {
                        const priceEl = document.getElementById(`wl-price-${sym}`);
                        const changeEl = document.getElementById(`wl-change-${sym}`);
                        if(priceEl && changeEl) {
                            const oldPrice = parseFloat(priceEl.dataset.price || 0), newPrice = liveData[sym].price || 0;
                            if (newPrice !== oldPrice && oldPrice !== 0) {
                                priceEl.classList.remove('flash-green', 'flash-red'); void priceEl.offsetWidth; 
                                priceEl.classList.add(newPrice > oldPrice ? 'flash-green' : 'flash-red');
                            }
                            priceEl.innerText = `$${newPrice.toFixed(2)}`; priceEl.dataset.price = newPrice;
                            const isUp = (liveData[sym].change || 0) >= 0;
                            changeEl.className = `text-xs font-medium transition-colors ${isUp ? 'text-green-500' : 'text-red-500'}`;
                            changeEl.innerText = `${isUp ? '+' : ''}${(liveData[sym].change||0)} (${isUp ? '+' : ''}${(liveData[sym].change_pct||0)}%)`;
                        }
                    }
                });

                if (currentSymbol && currentSymbol !== '--') {
                    let screenerList = (globalData && Array.isArray(globalData.screener_data)) ? globalData.screener_data : [];
                    let symbolData = screenerList.find(x => x && x.symbol === currentSymbol);
                    updateIntelligencePanel(currentSymbol, symbolData, liveData[currentSymbol] ? liveData[currentSymbol].price : null);
                }

                // 更新過濾池裡的「即時距離 & 狀態」
                const screenerArr = (globalData && Array.isArray(globalData.screener_data)) ? globalData.screener_data : [];
                for (let sym in liveData) {
                    const statusDistEl = document.getElementById(`status-dist-${sym}`);
                    if (statusDistEl) {
                        let item = screenerArr.find(x => x && x.symbol === sym);
                        if (item && item.entry_top > 0 && !item.trade_status.includes('⚠️')) {
                            let p = liveData[sym].price || 0;
                            let distText = "";
                            let finalHtml = `<div class="${item.status_color} text-[13px]">${item.trade_status}</div>`;
                            
                            if (item.direction === 'short') {
                                if (p <= item.entry_top && p >= item.entry_bot) {
                                    distText = `<span class="bg-red-900/60 text-red-400 px-1.5 rounded animate-pulse">🔥 入區 (做空)</span>`;
                                } else if (p < item.entry_bot) {
                                    distText = `<span class="text-gray-400 text-[11px]">距賣點 ${(((item.entry_bot - p)/p)*100).toFixed(2)}%</span>`;
                                } else { distText = `<span class="text-red-500 text-[11px]">已突破</span>`; }
                            } else {
                                if (p <= item.entry_top && p >= item.entry_bot) {
                                    distText = `<span class="bg-green-900/60 text-green-400 px-1.5 rounded animate-pulse">🔥 入區 (做多)</span>`;
                                } else if (p > item.entry_top) {
                                    distText = `<span class="text-gray-400 text-[11px]">距買點 ${(((p - item.entry_top)/item.entry_top)*100).toFixed(2)}%</span>`;
                                } else { distText = `<span class="text-red-500 text-[11px]">已跌破</span>`; }
                            }
                            statusDistEl.innerHTML = finalHtml + `<div class="mt-0.5">${distText}</div>`;
                        }
                    }
                }

                if (currentSymbol && liveData[currentSymbol] && currentPriceLine && candleSeries && currentCandleData.length > 0) {
                    const newPrice = liveData[currentSymbol].price;
                    currentPriceLine.applyOptions({ price: newPrice, title: `Live: $${newPrice.toFixed(2)}` });
                    const lastCandle = currentCandleData[currentCandleData.length - 1];
                    lastCandle.close = newPrice;
                    if (newPrice > lastCandle.high) lastCandle.high = newPrice;
                    if (newPrice < lastCandle.low) lastCandle.low = newPrice;
                    candleSeries.update(lastCandle);
                }
            } catch (err) {}
        }

        function drawSparkline(canvasId, basePrice, isPositive) {
            try {
                const canvas = document.getElementById(canvasId);
                if(!canvas) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.width, h = canvas.height;
                let pts = [basePrice || 100];
                for(let i=0; i<15; i++) pts.unshift(pts[0] + (Math.random()-0.5)*(basePrice||100)*0.015);
                if (isPositive) pts.sort((a,b) => a-b); else pts.sort((a,b) => b-a);
                const min = Math.min(...pts), max = Math.max(...pts), range = (max - min) || 1;
                ctx.clearRect(0, 0, w, h); ctx.beginPath();
                ctx.strokeStyle = isPositive ? '#22c55e' : '#ef4444'; ctx.lineWidth = 1.5;
                pts.forEach((p, i) => {
                    const x = (i / (pts.length - 1)) * w, y = h - ((p - min) / range) * (h - 4) - 2;
                    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.stroke();
            } catch(e) {}
        }

        function renderWatchlist() {
            try {
                const container = document.getElementById('watchlistContainer');
                if (!container) return;
                container.innerHTML = '';
                const watchlistMap = new Map();
                if (globalData && Array.isArray(globalData.watchlist_data)) {
                    globalData.watchlist_data.forEach(item => { if (item && item.symbol) watchlistMap.set(item.symbol, item); });
                }

                userWatchlist.forEach(sym => {
                    let item = watchlistMap.get(sym) || { symbol: sym, price: 0, change: 0, change_pct: 0 };
                    let price = currentLivePrices[sym] || item.price || 0;
                    const isPositive = (item.change || 0) >= 0;
                    
                    const card = document.createElement('div');
                    card.className = 'flex-shrink-0 w-44 glass-panel rounded-lg p-3 relative cursor-pointer hover:border-gray-500 transition-colors bg-[#0d1117] group';
                    card.onclick = () => updateChartSymbol(item.symbol);
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-bold text-base text-white">${item.symbol || '--'}</span>
                            <button type="button" onclick="removeFromWatchlist(event, '${item.symbol}')" class="text-gray-400 hover:text-red-400 text-sm p-1 transition-colors z-10"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="wl-price-${item.symbol}" data-price="${price}" class="text-lg font-semibold inline-block ${isPositive ? 'text-green-500' : 'text-red-500'}">$${price.toFixed(2)}</div>
                        <div id="wl-change-${item.symbol}" class="text-xs font-medium ${isPositive ? 'text-green-500' : 'text-red-500'}">
                            ${isPositive && item.change !== 0 ? '+' : ''}${item.change||0} (${isPositive && item.change_pct !== 0 ? '+' : ''}${item.change_pct||0}%)
                        </div>
                        <canvas id="sparkline-${item.symbol}" width="150" height="32" class="sparkline pointer-events-none"></canvas>
                    `;
                    container.appendChild(card);
                    setTimeout(() => { drawSparkline(`sparkline-${item.symbol}`, price, isPositive); }, 50);
                });
            } catch(e) {}
        }

        // ⚡ AI 面板與 P/D 矩陣更新
        function updateIntelligencePanel(symbol, symbolData, livePriceOverride = null) {
            try {
                const badgeEl = document.getElementById('panelSymbolBadge');
                if (badgeEl) badgeEl.innerText = symbol || '--';
                
                const pdMarker = document.getElementById('pdMarker');
                const pdValueText = document.getElementById('pdValueText');
                const insightEl = document.getElementById('panelInsight');
                
                if (!pdMarker || !insightEl) return;

                let livePrice = livePriceOverride || currentLivePrices[symbol] || (symbolData ? symbolData.price : 0);

                if (symbolData) {
                    // 更新 P/D 位置
                    if (symbolData.macro_bsl && symbolData.macro_ssl) {
                        let pdPercent = ((livePrice - symbolData.macro_ssl) / (symbolData.macro_bsl - symbolData.macro_ssl)) * 100;
                        pdPercent = Math.max(0, Math.min(100, pdPercent));
                        pdMarker.style.left = `calc(${pdPercent}% - 8px)`;
                        pdValueText.innerText = `${pdPercent.toFixed(1)}%`;
                        pdValueText.className = pdPercent > 50 ? "text-red-400 font-bold" : "text-green-400 font-bold";
                    }

                    // 強制紀律警語
                    if (symbolData.smc_id) {
                        let bgStyle = symbolData.trade_status.includes('⚠️') || symbolData.trade_status.includes('❌') ? "bg-red-900/20 border-red-500/30 text-red-400" : "bg-blue-900/20 border-blue-500/30 text-blue-300";
                        insightEl.innerHTML = `
                            <div class="mb-2 p-2 rounded border bg-[#1f242c] border-[#30363d] text-white">
                                系統判定狀態：<span class="${symbolData.status_color}">${symbolData.trade_status}</span>
                            </div>
                            <div class="p-2 rounded border ${bgStyle} font-bold text-sm">
                                ${symbolData.inv_text}
                            </div>
                        `;
                    } else {
                        insightEl.innerHTML = `<span class="text-gray-500">該股目前未偵測到合格的 SMC 進場結構。</span>`;
                    }
                } else {
                    pdMarker.style.left = `50%`;
                    pdValueText.innerText = `--%`;
                    insightEl.innerHTML = `<span class="text-gray-500">無數據</span>`;
                }
            } catch(e) {}
        }

        function changeSort(col) {
            if (sortCol === col) { sortDesc = !sortDesc; } 
            else { sortCol = col; sortDesc = true; }
            renderScreenerData();
        }

        function renderScreenerData() {
            try {
                const tbody = document.getElementById('screenerTableBody');
                if (!tbody) return;
                
                if (!globalData || !Array.isArray(globalData.screener_data)) {
                    tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">尚無數據</td></tr>`; 
                    return;
                }
                
                let dataToRender = [...globalData.screener_data].filter(x => x !== null);
                
                if (currentTab === 'smc') dataToRender = dataToRender.filter(item => item && item.smc_id);
                else if (currentTab === 'watchlist') dataToRender = dataToRender.filter(item => item && userWatchlist.includes(item.symbol));

                const directionFilter = document.getElementById('filterDirection') ? document.getElementById('filterDirection').value : 'ALL';
                if (directionFilter === 'LONG') dataToRender = dataToRender.filter(item => item.direction !== 'short');
                else if (directionFilter === 'SHORT') dataToRender = dataToRender.filter(item => item.direction === 'short');

                dataToRender.forEach(item => {
                    let livePrice = currentLivePrices[item.symbol] || item.price || 0;
                    if (item.entry_top && item.entry_top > 0) {
                        if (item.direction === 'short') item._liveDist = ((item.entry_bot - livePrice) / livePrice) * 100;
                        else item._liveDist = ((livePrice - item.entry_top) / item.entry_top) * 100;
                    } else { item._liveDist = 9999; }
                });

                dataToRender.sort((a, b) => {
                    let valA = 0, valB = 0;
                    if (sortCol === 'rrr') { valA = parseFloat(a.rrr) || 0; valB = parseFloat(b.rrr) || 0; } 
                    else if (sortCol === 'dist') { valA = a._liveDist; valB = b._liveDist; }
                    return sortDesc ? (valB - valA) : (valA - valB);
                });

                tbody.innerHTML = '';
                if (dataToRender.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">目前無符合要求之數據</td></tr>`; 
                    return;
                }

                dataToRender.forEach(item => {
                    const tr = document.createElement('tr'); 
                    tr.className = 'border-b border-[#30363d] clickable-row'; 
                    tr.onclick = () => updateChartSymbol(item.symbol);
                    
                    let livePrice = currentLivePrices[item.symbol] || item.price || 0;
                    
                    // ⚡ 整合狀態與距離欄位
                    let statusDistHtml = `<div class="${item.status_color || 'text-gray-400'} text-[13px]">${item.trade_status || '-'}</div>`;
                    if (item.entry_top && item._liveDist !== 9999 && !item.trade_status.includes('⚠️')) {
                        let distText = "";
                        if (item.direction === 'short') {
                            if (livePrice <= item.entry_top && livePrice >= item.entry_bot) distText = `<span class="bg-red-900/60 text-red-400 px-1.5 rounded animate-pulse">🔥 入區 (做空)</span>`;
                            else if (livePrice < item.entry_bot) distText = `<span class="text-gray-400 text-[11px]">距賣點 ${item._liveDist.toFixed(2)}%</span>`;
                            else distText = `<span class="text-red-500 text-[11px]">已突破</span>`;
                        } else {
                            if (livePrice <= item.entry_top && livePrice >= item.entry_bot) distText = `<span class="bg-green-900/60 text-green-400 px-1.5 rounded animate-pulse">🔥 入區 (做多)</span>`;
                            else if (livePrice > item.entry_top) distText = `<span class="text-gray-400 text-[11px]">距買點 ${item._liveDist.toFixed(2)}%</span>`;
                            else distText = `<span class="text-red-500 text-[11px]">已跌破</span>`;
                        }
                        statusDistHtml += `<div class="mt-0.5">${distText}</div>`;
                    }

                    let nameHtml = `<div class="flex items-center gap-1.5 font-bold text-white">${item.symbol || '--'}</div>`;
                    let smcHtml = `<span class="px-2 py-1 rounded text-xs font-semibold border ${item.smc_class || 'border-gray-600 text-gray-400'} whitespace-nowrap">${item.smc_text || '-'}</span>`;

                    tr.innerHTML = `
                        <td class="px-4 py-3">${nameHtml}</td>
                        <td class="px-4 py-3 font-mono" id="status-dist-${item.symbol}">${statusDistHtml}</td>
                        <td class="px-4 py-3 text-center">${smcHtml}</td>
                        <td class="px-4 py-3 text-center font-mono font-bold ${item.rrr >= 2 ? 'text-green-400' : 'text-gray-300'}">1 : ${item.rrr || 0}</td>
                        <td class="px-4 py-3 text-right font-mono text-sm text-blue-300">$${item.entry_bot || 0} - $${item.entry_top || 0}</td>
                        <td class="px-4 py-3 text-right font-mono text-sm text-green-400">$${item.tp || 0}</td>
                        <td class="px-4 py-3 text-right font-mono font-bold text-sm text-red-500 bg-red-900/10">$${item.sl || 0}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {}
        }

        // ⚡ 圖表引擎 - 無遮擋極低透明度設計
        function initCharts() {
            const container = document.getElementById('tv_chart_container');
            const tooltip = document.getElementById('chartTooltip');
            if(!container) return;

            chart = LightweightCharts.createChart(container, { 
                layout: { textColor: '#c9d1d9', background: { type: 'solid', color: '#161b22' } },
                grid: { vertLines: { color: 'rgba(48, 54, 61, 0.5)' }, horzLines: { color: 'rgba(48, 54, 61, 0.5)' } },
                timeScale: { borderColor: '#30363d', timeVisible: true, secondsVisible: false }, 
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
            });
            
            candleSeries = chart.addCandlestickSeries({ 
                upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, 
                wickUpColor: '#26a69a', wickDownColor: '#ef5350' 
            });

            chart.subscribeCrosshairMove(param => {
                if (!param.point || !param.time || param.point.x < 0 || param.point.x > container.clientWidth || param.point.y < 0 || param.point.y > container.clientHeight) {
                    tooltip.style.display = 'none';
                } else {
                    const data = param.seriesData.get(candleSeries);
                    if (data) {
                        tooltip.style.display = 'block'; 
                        const color = data.close >= data.open ? '#26a69a' : '#ef5350';
                        tooltip.innerHTML = `
                            <div style="color: #c9d1d9; margin-bottom: 4px; font-weight: bold;"><i class="fa-solid fa-crosshairs text-blue-400 mr-1"></i> K線</div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px;">
                                <div>O: <span style="color:${color}">${data.open.toFixed(2)}</span></div>
                                <div>H: <span style="color:${color}">${data.high.toFixed(2)}</span></div>
                                <div>L: <span style="color:${color}">${data.low.toFixed(2)}</span></div>
                                <div>C: <span style="color:${color}">${data.close.toFixed(2)}</span></div>
                            </div>`;
                    }
                }
            });

            new ResizeObserver(entries => {
                for (let entry of entries) {
                    if (entry.target === container && container.clientWidth > 0) {
                        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
                    }
                }
            }).observe(container);
        }

        async function updateChartSymbol(symbol) {
            try {
                const symEl = document.getElementById('currentChartSymbol');
                if (symEl) symEl.innerText = symbol || '--';
                
                let screenerList = (globalData && Array.isArray(globalData.screener_data)) ? globalData.screener_data : [];
                currentSymbolData = screenerList.find(x => x && x.symbol === symbol);

                if(!candleSeries) return;

                const loader = document.getElementById('chartLoader');
                if(loader) loader.style.display = 'flex';

                activePriceLines.forEach(line => { try{ candleSeries.removePriceLine(line); } catch(e){} }); 
                activePriceLines = []; 
                if(currentPriceLine) { try{ candleSeries.removePriceLine(currentPriceLine); } catch(e){} currentPriceLine = null; }

                let data = [];
                const tfParam = currentTimeFrame.toLowerCase();
                try {
                    const res = await fetch(`${VERCEL_API_URL}?symbols=${symbol}&interval=${tfParam}&t=${Date.now()}`);
                    if (res.ok) {
                        const jsonRes = await res.json();
                        if (jsonRes[symbol] && jsonRes[symbol].chart) {
                            let uniqueChart = []; let lastTime = 0;
                            for (let c of jsonRes[symbol].chart) {
                                if (c.time !== lastTime) { uniqueChart.push(c); lastTime = c.time; }
                            }
                            data = uniqueChart;
                        }
                    }
                } catch(e) {}

                if(loader) loader.style.display = 'none';

                if (data.length > 0) {
                    currentCandleData = data;
                    let livePrice = currentLivePrices[symbol];
                    if (livePrice) {
                        let lastCandle = currentCandleData[currentCandleData.length - 1];
                        lastCandle.close = livePrice;
                        if (livePrice > lastCandle.high) lastCandle.high = livePrice;
                        if (livePrice < lastCandle.low) lastCandle.low = livePrice;
                    }
                    candleSeries.setData(currentCandleData);
                }
                
                try { updateIntelligencePanel(symbol, currentSymbolData); } catch(e) {}

                if (currentSymbolData && currentCandleData.length > 0) {
                    currentPriceLine = candleSeries.createPriceLine({ 
                        price: currentSymbolData.price || 0, color: '#ffffff', lineWidth: 1, 
                        lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: `市價: $${currentSymbolData.price || 0}` 
                    });
                    
                    if (currentSymbolData.smc_id) {
                        const isShort = currentSymbolData.direction === 'short';
                        
                        // ⚡ 視覺優化：取消實心色塊，使用邊緣對齊與極低透明度 (10-15%)
                        const zoneColor = isShort ? 'rgba(248, 113, 113, 0.15)' : 'rgba(74, 222, 128, 0.15)'; // 淡紅 / 淡綠
                        const textName = isShort ? 'Bearish Zone' : 'Bullish Zone';
                        
                        const topLine = candleSeries.createPriceLine({ price: currentSymbolData.entry_top || 0, color: zoneColor, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: textName });
                        const botLine = candleSeries.createPriceLine({ price: currentSymbolData.entry_bot || 0, color: zoneColor, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: textName });
                        
                        // ⚡ 強制繪製醒目的紅色虛線「Invalidation (失效線)」
                        const slLine = candleSeries.createPriceLine({ price: currentSymbolData.sl || 0, color: '#ef4444', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: `🚨 Invalidation` });
                        
                        const tpLine = candleSeries.createPriceLine({ price: currentSymbolData.tp || 0, color: '#4ade80', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: true, title: `TP` });
                        
                        activePriceLines.push(topLine, botLine, slLine, tpLine);
                    }
                }
                
                chart.timeScale().fitContent(); 
                chart.priceScale('right').applyOptions({ autoScale: true });
            } catch(e) {}
        }

        function switchTab(tab) {
            currentTab = tab;
            const tSmc = document.getElementById('tabSmc');
            const tWl = document.getElementById('tabWatchlist');
            if(tSmc) tSmc.className = (tab==='smc') ? "px-4 py-2 text-sm font-medium text-blue-400 border-b-2 border-blue-500 whitespace-nowrap" : "px-4 py-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-white whitespace-nowrap";
            if(tWl) tWl.className = (tab==='watchlist') ? "px-4 py-2 text-sm font-medium text-blue-400 border-b-2 border-blue-500 whitespace-nowrap" : "px-4 py-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-white whitespace-nowrap";
            renderScreenerData();
        }

        function addCustomStock(e) { 
            e.preventDefault(); 
            const input = document.getElementById('searchInput');
            if(!input) return;
            const val = input.value.trim().toUpperCase(); 
            if(!val) return;
            if (userWatchlist.includes(val)) { showToast(`股票 ${val} 已經在自選清單中`, 'error'); input.value = ''; return; }
            userWatchlist.push(val); renderWatchlist(); renderScreenerData(); 
            try { fetchLiveQuotes(); } catch(err){}
            showToast(`成功加入自選: ${val}`); input.value = ''; 
        }

        function removeFromWatchlist(event, sym) {
            event.stopPropagation(); 
            userWatchlist = userWatchlist.filter(s => s !== sym);
            if(currentLivePrices[sym]) delete currentLivePrices[sym];
            renderWatchlist(); renderScreenerData(); showToast(`已從自選移除: ${sym}`, 'error');
        }

        function toggleSection(cId, iId) { 
            const c = document.getElementById(cId);
            const i = document.getElementById(iId);
            if(c) {
                c.classList.toggle('collapsed');
                if (!c.classList.contains('collapsed') && cId === 'chartContent') {
                    setTimeout(() => { if (chart) chart.timeScale().fitContent(); }, 350);
                }
            }
            if(i) i.classList.toggle('rotate-180'); 
        }

        function showToast(msg, type='success') { 
            const c = document.getElementById('toast-container');
            if(!c) return;
            const t = document.createElement('div'); 
            t.className = `toast ${type==='error'?'error':''}`; 
            t.innerHTML = `<i class="fa-solid ${type==='error'?'fa-trash':'fa-check-circle'} mr-2"></i> ${msg}`; 
            c.appendChild(t); 
            setTimeout(() => t.classList.add('show'), 10); 
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000); 
        }
        
        function changeTimeFrame(tf) { 
            currentTimeFrame = tf; 
            ['15m','4H','1D'].forEach(t => { 
                const btn = document.getElementById('tf_'+t);
                if(btn) { btn.className = (t===tf) ? "px-3 py-1 font-medium rounded bg-[#30363d] text-white transition-colors" : "px-3 py-1 font-medium rounded text-gray-400 hover:text-white transition-colors"; }
            }); 
            const curSym = document.getElementById('currentChartSymbol');
            if(curSym && curSym.innerText !== '--') updateChartSymbol(curSym.innerText); 
        }
    </script>
</body>
